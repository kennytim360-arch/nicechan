<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nice Chan</title>
<meta name="description" content="Read public forum discussions side by side. Safe mode is on by default.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="toprow">
    <span class="boards" id="boards">[<a href="#/">all</a>]</span>
    <span class="utility">[<button class="act" id="search-toggle" type="button" aria-expanded="false">Search</button>] [<a href="#/digest">stories</a>] [<a href="#/">Home</a>]</span>
  </div>

  <header class="bar">
    <div class="bar-row">
      <a class="brand" href="#/">&gt;nicechan</a>
      <nav class="bar-nav" aria-label="Main">
        <a href="#/">hot</a><span>|</span><a href="#/new">new</a><span>|</span><a href="#/past">past</a><span>|</span><a href="#/sources">sources</a><span>|</span><a href="#/about">about</a><span>|</span><a href="#/login">login</a>
      </nav>
      <button class="act bar-safe" id="safe" type="button" aria-pressed="true">safe mode: <b>on</b></button>
    </div>
  </header>

  <div class="search" id="search-box" hidden>
    <label for="filter">Filter these threads</label>
    <input id="filter" type="search" autocomplete="off">
  </div>

  <main id="view" class="main" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
