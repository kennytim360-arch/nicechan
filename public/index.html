<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nice Chan</title>
<meta name="description" content="Read public forum discussions side by side, with Safe mode on by default.">
<link rel="stylesheet" href="style.css">
<script>
  // Apply saved theme before first paint to avoid a flash.
  try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu" aria-label="Show boards">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/g">nice<span>chan</span></a>

    <div class="search">
      <input id="search" type="search" placeholder="Filter threads" aria-label="Filter threads" autocomplete="off">
      <kbd class="kbd">/</kbd>
    </div>

    <div class="top-actions">
      <label class="switch" title="Blur rude words and images until you click them">
        <input type="checkbox" id="safe" checked>
        <span class="track"></span>
        <span class="lbl">Safe mode</span>
      </label>
      <button class="icon-btn" id="theme" aria-label="Change theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-title">Boards</div>
      <nav id="boards" class="board-list"><div class="muted pad">Loading boards…</div></nav>
    </aside>
    <main class="main" id="main">
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
</div>

<script src="app.js"></script>
</body>
</html>
